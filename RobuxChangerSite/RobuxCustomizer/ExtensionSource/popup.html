<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      width: 210px;
      padding: 12px;
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #191b1d;
      color: #ffffff;
    }
    label {
      font-size: 12px;
      display: block;
      margin-bottom: 6px;
      color: #bbbbbb;
    }
    input {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #393b3d;
      border-radius: 4px;
      background: #111213;
      color: #fff;
      margin-bottom: 10px;
      outline: none;
    }
    input:focus {
      border-color: #00a2ff;
    }
    button {
      width: 100%;
      padding: 8px;
      background: #00a2ff;
      border: none;
      color: white;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #0082cc;
    }
    #status {
      margin-top: 8px;
      font-size: 11px;
      text-align: center;
      color: #00ff88;
      display: none;
    }
  </style>
</head>
<body>
  <label for="robuxVal">Type Displayed Robux:</label>
  <input type="text" id="robuxVal" placeholder="e.g. 10 or 50,000" />
  <button id="saveBtn">Apply Change</button>
  <div id="status">✓ Applied!</div>

  <script>
    const statusDiv = document.getElementById("status");

    // Load saved value
    chrome.storage.sync.get(["customRobux"], (data) => {
      if (data.customRobux !== undefined) {
        document.getElementById("robuxVal").value = data.customRobux;
      }
    });

    document.getElementById("saveBtn").addEventListener("click", () => {
      const inputVal = document.getElementById("robuxVal").value.trim();

      if (inputVal === "") return;

      chrome.storage.sync.set({ customRobux: inputVal }, () => {
        chrome.tabs.query({ active: true, currentWindow: true }, (tabs) => {
          if (tabs[0]?.id) {
            chrome.tabs.sendMessage(tabs[0].id, { action: "update", value: inputVal }, (response) => {
              // Show status indicator on success
              statusDiv.style.display = "block";
              statusDiv.textContent = "✓ Applied to page!";
              setTimeout(() => { statusDiv.style.display = "none"; }, 2000);
            });
          }
        });
      });
    });
  </script>
</body>
</html>
